services:
  chrome:
    image: lscr.io/linuxserver/chromium:latest
    container_name: selenium-chrome
    shm_size: 512mb
    ports:
      - "3000:3000" # Podgląd na żywo w przeglądarce (KasmVNC)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
      - CHROME_CLI=--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 https://orteil.dashnet.org/cookieclicker/
    volumes:
      - chrome_profile:/config
    restart: unless-stopped

  bot:
    build: https://github.com/Twiggiermaen21/CookieClickerSeleniumBot.git
    container_name: cookie-clicker-bot
    depends_on:
      - chrome
    environment:
      - SELENIUM_DEBUGGER_ADDRESS=chrome:9222
    volumes:
      - allure_results:/app/target/allure-results
    restart: unless-stopped

  allure:
    image: frankescobar/allure-docker-service
    container_name: allure-report
    ports:
      - "5050:5050"
    environment:
      - CHECK_RESULTS_EVERY_SECONDS=10
      - KEEP_HISTORY=1
    volumes:
      - allure_results:/app/allure-results
    restart: unless-stopped

volumes:
  chrome_profile:
  allure_results: